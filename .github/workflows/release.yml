name: Release Binaries

on:
  push:
    tags:
      - 'v*' # Trigger on version tags, e.g., v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux builds
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: linux
            arch: arm
          # macOS builds (for development)
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.0'

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -o dist/lazywal-${{ matrix.os }}-${{ matrix.arch }} ./cmd/lazywal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lazywal-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/lazywal-${{ matrix.os }}-${{ matrix.arch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          artifacts: dist/*
          generateReleaseNotes: true
          body: |
            ## Lazywal ${{ github.ref_name }}
            
            ### Downloads
            - Linux: `lazywal-linux-amd64`, `lazywal-linux-arm64`, `lazywal-linux-arm`
            - macOS: `lazywal-darwin-amd64`, `lazywal-darwin-arm64` (Apple Silicon)
            
            ### Note
            This tool requires X11 and is primarily designed for Linux systems.
            macOS builds are provided for development purposes only.
            
            ### Dependencies
            Requires:
            - xwinwrap
            - mpv
            - xrandr

